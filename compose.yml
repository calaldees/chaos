services:

  nginx:
    build:
      context: ./
      target: nginx
    ports:
      - 80:80
    links:
      - channel-server
      # - nanomq
    volumes:
        - logs:/var/log

  # channel-server:
  #   build:
  #     context: ./channelServer/
  #     target: production
  #   command: [ '--log_level=20', '--first_peer' ]
  #   ports:         # Only for local development
  #     - 9800:9800  # Only for local development

  nanomq:
    image: emqx/nanomq:latest-slim
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ${PWD}/nanomq/nanomq.conf:/usr/local/nanomq/nanomq.conf:ro
      - nanomq_sqlite:/var/lib/nanomq/sqlite

volumes:
  logs:
  nanomq_sqlite:
